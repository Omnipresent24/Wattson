name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # PR-only: пуши в main всегда проходят полный локальный прогон перед релизом,
      # гонять 3.5k тестов второй раз на медленном раннере — дубль. На PR локального
      # прогона нет, там тесты обязательны.
      - name: Unit tests
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      # WATTSON fork: run logs are not readable from the fork's tooling, so every detekt finding
      # becomes an annotation on the check run.
      - name: detekt findings as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          for f in glob.glob('app/build/reports/detekt/*.xml'):
              for file in ET.parse(f).getroot().iter('file'):
                  path = os.path.relpath(file.get('name'), os.getcwd())
                  for e in file.iter('error'):
                      msg = (e.get('source','') + ': ' + e.get('message','')).replace('\n',' ')
                      print(f"::error file={path},line={e.get('line','1')}::{msg}")
          PY

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14
